[project]
name = "account-keeper-agent"
version = "0.1.0"
description = "Webサービス登録情報をローカルで管理するエージェント（モック）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ak = "account_keeper.cli:main"
account-keeper-mcp = "account_keeper.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["account_keeper"]
